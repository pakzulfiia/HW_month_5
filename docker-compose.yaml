version: '3'
services: 
  shop_api:
    build:
      context: .
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8001:8000" 

  shop_data:
    image: 'postgres:14'
    environment: 
      POSTGRES_DB: shop_api
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: 1234
    volumes:
      - 'data:/var/lib/postgresql/data'
volumes:
  data: